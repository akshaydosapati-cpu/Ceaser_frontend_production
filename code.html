<!-- STITCH_SVG_START:ANIMATION_9 class="w-full h-full" --><div class="w-full h-full" id="animated-svg-ANIMATION_9" style="display:block;"><svg height="100%" viewbox="0 0 800 450" width="100%" xmlns="http://www.w3.org/2000/svg">

<style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Space+Grotesk:wght@600;700&display=swap');

      * {
        box-sizing: border-box;
      }

      .bg-fill {
        fill: #000000;
      }

      /* Masked viewport styling for mechanical tumbler drum housings */
      .slot-frame {
        fill: #080808;
        stroke: #222222;
        stroke-width: 1.5;
        rx: 16;
      }

      /* 3D Depth gradients & scanline shadow overlays */
      .drum-shading {
        pointer-events: none;
      }

      /* Monospace roll typography */
      .letter-stroke {
        fill: #ffffff;
        font-family: 'Orbitron', 'Space Grotesk', -apple-system, sans-serif;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
        letter-spacing: 0.05em;
      }

      /* Dial tumbler tracks: vertical translation animation */
      /* Total cycle: 7.5s. Roll and arrive around 2.0s - 2.3s (~28-30%).
         Hold fixed on NIX for 5.0 seconds (from ~33% to ~97%).
         Then quick snap back or restart at 100%. */
      @keyframes rollDial1 {
        0% { transform: translateY(0px); filter: blur(0px); }
        4% { transform: translateY(-160px); filter: blur(2px); }
        11% { transform: translateY(-720px); filter: blur(4px); }
        19% { transform: translateY(-1440px); filter: blur(3px); }
        25% { transform: translateY(-2000px); filter: blur(1.5px); }
        28% { transform: translateY(-2160px); filter: blur(0px); }
        /* Target 'N' is reached at step 18 (-2160px) */
        29% { transform: translateY(-2172px); }
        31% { transform: translateY(-2156px); }
        33%, 97% { transform: translateY(-2160px); filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.75)); }
        99%, 100% { transform: translateY(0px); filter: blur(0px); }
      }

      @keyframes rollDial2 {
        0% { transform: translateY(0px); filter: blur(0px); }
        3% { transform: translateY(-140px); filter: blur(1.5px); }
        12% { transform: translateY(-840px); filter: blur(4px); }
        20% { transform: translateY(-1600px); filter: blur(3.5px); }
        26% { transform: translateY(-2240px); filter: blur(1.5px); }
        29.5% { transform: translateY(-2400px); filter: blur(0px); }
        /* Target 'I' is reached at step 20 (-2400px) */
        30.5% { transform: translateY(-2414px); }
        32% { transform: translateY(-2396px); }
        33.5%, 97% { transform: translateY(-2400px); filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.75)); }
        99%, 100% { transform: translateY(0px); filter: blur(0px); }
      }

      @keyframes rollDial3 {
        0% { transform: translateY(0px); filter: blur(0px); }
        5% { transform: translateY(-180px); filter: blur(2px); }
        14% { transform: translateY(-1020px); filter: blur(4.5px); }
        22% { transform: translateY(-1900px); filter: blur(3px); }
        28% { transform: translateY(-2640px); filter: blur(1.5px); }
        31% { transform: translateY(-2760px); filter: blur(0px); }
        /* Target 'X' is reached at step 23 (-2760px) */
        32% { transform: translateY(-2774px); }
        33% { transform: translateY(-2756px); }
        34%, 97% { transform: translateY(-2760px); filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.75)); }
        99%, 100% { transform: translateY(0px); filter: blur(0px); }
      }

      .tumbler-col-1 {
        animation: rollDial1 7.5s cubic-bezier(0.18, 0.89, 0.22, 1) infinite;
      }

      .tumbler-col-2 {
        animation: rollDial2 7.5s cubic-bezier(0.18, 0.89, 0.22, 1) infinite;
      }

      .tumbler-col-3 {
        animation: rollDial3 7.5s cubic-bezier(0.18, 0.89, 0.22, 1) infinite;
      }

      /* Sleek hud lock indicators */
      @keyframes lockPulse {
        0%, 27% { opacity: 0.15; stroke: #333333; }
        34%, 96% { opacity: 1; stroke: #ffffff; filter: drop-shadow(0 0 6px rgba(255,255,255,0.8)); }
        99%, 100% { opacity: 0.15; stroke: #333333; }
      }

      .lock-marker {
        animation: lockPulse 7.5s ease-in-out infinite;
      }

      .bezel-screw {
        fill: #1c1c1c;
        stroke: #2e2e2e;
        stroke-width: 0.8;
      }
